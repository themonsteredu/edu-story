name: Generate lesson 01 documents

on:
  workflow_dispatch:
  push:
    branches:
      - feat/lesson-01
    paths:
      - scripts/generate_resources.py.gz.b64
      - .github/workflows/generate-lesson-01-resources.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lesson branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document generators
        run: python -m pip install --disable-pip-version-check python-pptx==1.0.2 python-docx==1.2.0

      - name: Restore and run generator
        run: |
          base64 --decode scripts/generate_resources.py.gz.b64 | gzip --decompress > scripts/generate_resources.py
          python scripts/generate_resources.py
          rm scripts/generate_resources.py
          mkdir -p src/assets/teacher
          mv public/resources/lesson-01/03_1차시_교수학습과정안.docx src/assets/teacher/03_1차시_교수학습과정안.docx
          mv public/resources/lesson-01/04_1차시_교사용답안.docx src/assets/teacher/04_1차시_교사용답안.docx

      - name: Commit generated DOCX files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/resources/lesson-01/02_1차시_학생활동지.docx src/assets/teacher
          if git diff --cached --quiet; then
            echo "Generated files are already current."
          else
            git commit -m "chore: generate lesson 01 resources"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
